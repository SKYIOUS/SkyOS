[package]
name = "nettools"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
libsarga = { path = "../libsarga" }

[[bin]]
name = "ifconfig"
path = "src/ifconfig.rs"

[[bin]]
name = "curl"
path = "src/curl.rs"

[[bin]]
name = "nc"
path = "src/nc.rs"

[[bin]]
name = "echod"
path = "src/echod.rs"

[[bin]]
name = "resolve"
path = "src/resolve.rs"

[[bin]]
name = "udpechod"
path = "src/udpechod.rs"

[[bin]]
name = "udpechoc"
path = "src/udpechoc.rs"

[[bin]]
name = "httpd"
path = "src/httpd.rs"

[[bin]]
name = "wget"
path = "src/wget.rs"

[[bin]]
name = "ssh-server"
path = "src/ssh_server.rs"

[[bin]]
name = "dhcp-client"
path = "src/dhcp_client.rs"
