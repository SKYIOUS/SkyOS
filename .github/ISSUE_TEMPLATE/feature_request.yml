name: Feature Request
description: Suggest an idea for SkyOS
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea!
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Ex. "I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - kernel
        - userspace
        - ade (desktop)
        - libsarga
        - sash (shell)
        - coreutils
        - build system
        - docs
        - CI
        - other