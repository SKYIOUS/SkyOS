name: Stale Issues

on:
  schedule:
    - cron: "30 1 * * 1"

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: 30
          stale-issue-message: >
            This issue has been inactive for 90 days. If it's still relevant, please
            update it with current status. Otherwise it will be closed in 30 days.
          stale-pr-message: >
            This PR has been inactive for 90 days. Please address feedback or it will
            be closed in 30 days.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,planned
          exempt-pr-labels: pinned,security
          operations-per-run: 60