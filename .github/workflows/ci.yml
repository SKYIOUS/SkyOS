name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rustfmt --allow-downgrade
          rustup default nightly
      - name: cargo fmt
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component clippy --component rust-src --allow-downgrade
          rustup default nightly
      - name: cargo clippy
        run: cargo clippy -Zbuild-std=core,alloc --target x86_64-sarga.json -- -D warnings

  check-all-targets:
    name: Check all targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly with rust-src
        run: |
          rustup toolchain install nightly --component rust-src --allow-downgrade
          rustup default nightly
      - name: Build debug
        run: cargo build -Zbuild-std=core,alloc --target x86_64-sarga.json
      - name: Build release
        run: cargo build -Zbuild-std=core,alloc --target x86_64-sarga.json --release

  integration-qemu:
    name: QEMU integration test
    runs-on: ubuntu-22.04
    needs: [check-all-targets]
    steps:
      - uses: actions/checkout@v4
        with:
          path: SkyOS

      - name: Checkout SKYIOUS KERNEL
        uses: actions/checkout@v4
        with:
          repository: SKYIOUS/SKYIOUS-KERNEL
          path: SKYIOUS-KERNEL

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 mtools expect

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools-preview --allow-downgrade
          rustup default nightly

      - name: Build kernel with self_test
        working-directory: SKYIOUS-KERNEL/kernel
        run: cargo build --release --target x86_64-unknown-none -Zbuild-std=core,alloc --features net,smp,ai_rule,self_test

      - name: Build userspace
        working-directory: SkyOS
        run: cargo build -Zbuild-std=core,alloc --target x86_64-sarga.json --release

      - name: Build initrd and bootimage
        working-directory: SkyOS
        run: |
          python3 build_initrd.py
          mkdir -p SKYIOUS-KERNEL/SkyOS
          cp initrd.tar SKYIOUS-KERNEL/SkyOS/

      - name: Create UEFI bootimage
        working-directory: SKYIOUS-KERNEL
        run: cargo run --release --manifest-path builder/Cargo.toml

      - name: Create ISO
        working-directory: SkyOS
        run: |
          pip install pycdlib 2>/dev/null || true
          python3 scripts/make_iso.py "ci-$(date +%Y%m%d)"

      - name: QEMU integration test
        working-directory: SkyOS
        timeout-minutes: 5
        run: |
          ISO="$(ls release/skyos-ci-*.iso 2>/dev/null | head -1)"
          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO found"
            exit 1
          fi
          # Try expect-based integration test if available
          if command -v expect &>/dev/null; then
            expect tests/qemu_shell_test.exp "$ISO" 180 || true
          fi
          # Simple boot test (always runs)
          timeout 120 qemu-system-x86_64 \
            -bios OVMF.fd \
            -cdrom "$ISO" \
            -m 512M -smp 2 \
            -nographic -no-reboot \
            -serial mon:stdio \
            -device e1000,netdev=net0 -netdev user,id=net0 \
            2>&1 | tee qemu_log.txt

      - name: Check boot log and selftests
        working-directory: SkyOS
        run: |
          if grep -q "login:" qemu_log.txt; then
            echo "PASS: System booted and login prompt detected"
            if grep -q "PASS" qemu_log.txt; then
              echo "PASS: Additional integration tests passed"
            fi
          else
            echo "FAIL: No login prompt found in QEMU output"
            cat qemu_log.txt
            exit 1
          fi
          
          # Check for self-test failures (TAP format: "not ok")
          if grep -q "not ok" qemu_log.txt; then
            echo "FAIL: Self-test failures detected"
            grep "not ok" qemu_log.txt
            exit 1
          fi
          
          # Verify TAP header was emitted
          if grep -q "TAP version 13" qemu_log.txt; then
            echo "PASS: Self-test TAP output detected"
            # Extract and display summary
            grep "# .* passed" qemu_log.txt || true
          else
            echo "WARN: No TAP output found (selftests may not have run)"
          fi
