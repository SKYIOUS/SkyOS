name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly --component rustfmt --allow-downgrade
          rustup default nightly
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly --component clippy --component rust-src --allow-downgrade
          rustup default nightly
      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-
      - run: cargo clippy -Zbuild-std=core,alloc --target x86_64-sarga.json -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly --component rust-src --allow-downgrade
          rustup default nightly
      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: build-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ matrix.profile }}-
      - name: Build (${{ matrix.profile }})
        run: cargo build -Zbuild-std=core,alloc --target x86_64-sarga.json ${{ matrix.profile == 'release' && '--release' || '' }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  integration:
    name: Integration (QEMU)
    runs-on: ubuntu-22.04
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          path: SkyOS

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: SKYIOUS/SKYIOUS-KERNEL
          path: SKYIOUS-KERNEL

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso qemu-system-x86 mtools expect

      - name: Install nightly
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools-preview --allow-downgrade
          rustup default nightly

      - name: Build kernel (self_test)
        working-directory: SKYIOUS-KERNEL/kernel
        run: cargo build --release --target x86_64-unknown-none -Zbuild-std=core,alloc --features net,smp,ai_rule,self_test

      - name: Build userspace (release)
        working-directory: SkyOS
        run: cargo build -Zbuild-std=core,alloc --target x86_64-sarga.json --release

      - name: Build initrd
        working-directory: SkyOS
        run: python3 build_initrd.py

      - name: Copy initrd
        run: |
          mkdir -p SKYIOUS-KERNEL/SkyOS
          cp SkyOS/initrd.tar SKYIOUS-KERNEL/SkyOS/

      - name: Create UEFI bootimage
        working-directory: SKYIOUS-KERNEL
        run: cargo run --release --manifest-path builder/Cargo.toml

      - name: Create ISO
        working-directory: SkyOS
        run: |
          pip install pycdlib 2>/dev/null || true
          python3 scripts/make_iso.py "ci-$(date +%Y%m%d)"

      - name: QEMU boot test
        working-directory: SkyOS
        timeout-minutes: 5
        run: |
          ISO="$(ls release/skyos-ci-*.iso 2>/dev/null | head -1)"
          if [ -z "$ISO" ]; then echo "ERROR: No ISO found"; exit 1; fi

          if command -v expect &>/dev/null; then
            expect tests/qemu_shell_test.exp "$ISO" 180 || true
          fi

          timeout 120 qemu-system-x86_64 \
            -bios OVMF.fd \
            -cdrom "$ISO" \
            -m 512M -smp 2 \
            -nographic -no-reboot \
            -serial mon:stdio \
            -device e1000,netdev=net0 -netdev user,id=net0 \
            2>&1 | tee qemu_log.txt

      - name: Verify boot
        working-directory: SkyOS
        run: |
          if grep -q "login:" qemu_log.txt; then
            echo "PASS: Login prompt detected"
            if grep -q "not ok" qemu_log.txt; then
              echo "FAIL: Self-test failures detected"
              grep "not ok" qemu_log.txt
              exit 1
            fi
            if grep -q "TAP version 13" qemu_log.txt; then
              echo "PASS: Self-test TAP output detected"
            fi
          else
            echo "FAIL: No login prompt"
            cat qemu_log.txt
            exit 1
          fi